[workspace]
members = ["backend/lib", "backend/bin"]
exclude = ["frontend"]
default-members = ["backend/bin"]
resolver = "2"

[profile.release]
strip = true

[profile.release-small]
inherits = "release"
opt-level = "z"
lto = true
panic = 'abort'
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = 1
